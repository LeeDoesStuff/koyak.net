<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b12" />
    <title>KOYAK TOWER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" /></noscript>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="fps-meter" role="status" aria-label="Frames per second">-- FPS</div>
    <canvas class="plasma" aria-hidden="true"></canvas>
    <div class="mist mist--one" aria-hidden="true"></div>
    <div class="mist mist--two" aria-hidden="true"></div>

    <div class="page-shell">
      <aside class="side-rail side-rail--left" aria-hidden="true">
        <div class="rail-clip">
          <div class="rail-track">
            <div class="rail-loop"><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span></div>
            <div class="rail-loop"><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span></div>
          </div>
        </div>
      </aside>

      <main class="profile">
        <section class="hero">
          <img class="banner" src="Imgs/Banner.png" alt="Pixel art scene featuring a rainbow-haired character" />
          <div class="banner-shade"></div>
        </section>

        <section class="identity">
          <div class="avatar-frame">
            <div class="avatar-pixels"></div>
            <img src="Imgs/Pfp.gif" alt="Koyak animated profile picture" />
          </div>
          <div class="identity-copy">
            <h1>KOYAK</h1>
            <span class="floating-dot" aria-hidden="true"></span>
            <p>HE/HIM</p>
            <div class="social-group">
              <span class="floating-dot" aria-hidden="true"></span>
              <nav class="social-links" aria-label="Social profiles">
                <a href="https://github.com/Kayyo321" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile" title="GitHub">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7A11.5 11.5 0 0 0 8.36 23c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.19-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05a4.45 4.45 0 0 1 1.19 3.09c0 4.41-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
                </a>
                <a href="https://steamcommunity.com/id/kayyo_/" target="_blank" rel="noopener noreferrer" aria-label="Steam profile" title="Steam">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0A12 12 0 0 0 .19 9.86l6.46 2.67a3.39 3.39 0 0 1 1.93-.6l2.86-4.15v-.06a4.52 4.52 0 1 1 4.52 4.52h-.1l-4.08 2.91a3.4 3.4 0 0 1-6.73.62L.43 13.86A12 12 0 1 0 12 0ZM8.43 17.57l-1.48-.61a2.55 2.55 0 0 0 4.7-.23 2.56 2.56 0 0 0-1.38-3.34 2.5 2.5 0 0 0-1.9-.02l1.53.63a1.88 1.88 0 1 1-1.47 3.47v.1Zm7.53-6.84a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-.75a2.25 2.25 0 1 1 0-4.5 2.25 2.25 0 0 1 0 4.5Z"/></svg>
                </a>
              </nav>
            </div>
          </div>
        </section>

        <section class="retro-viewport" aria-label="Koyak desktop">
          <div class="retro-screen">
            <div class="desktop-icons" aria-label="Desktop shortcuts">
              <button class="desktop-icon" type="button" data-window="about">
                <span class="pixel-icon pixel-icon--computer" aria-hidden="true"></span>
                <span>ABOUT ME</span>
              </button>
              <button class="desktop-icon" type="button" data-window="projects">
                <span class="pixel-icon pixel-icon--folder" aria-hidden="true"></span>
                <span>PROJECTS</span>
              </button>
              <button class="desktop-icon" type="button" data-window="contact">
                <span class="pixel-icon pixel-icon--mail" aria-hidden="true"></span>
                <span>CONTACT</span>
              </button>
              <button class="desktop-icon" type="button" data-window="minesweeper">
                <span class="pixel-icon pixel-icon--mine" aria-hidden="true"></span>
                <span>MINESWEEPER</span>
              </button>
              <button class="desktop-icon desktop-icon--secret" type="button" data-window="tetris" hidden>
                <span class="pixel-icon pixel-icon--tetris" aria-hidden="true"></span>
                <span>TETRIS</span>
              </button>
              <button class="desktop-icon desktop-icon--secret" type="button" data-window="flight" hidden>
                <span class="pixel-icon pixel-icon--plane" aria-hidden="true"></span>
                <span>FLIGHT_SIM</span>
              </button>
            </div>

            <div class="retro-window" role="region" aria-live="polite" data-window-id="welcome">
              <div class="window-titlebar">
                <span class="window-title">WELCOME.TXT</span>
                <span class="window-controls"><i aria-hidden="true">_</i><i aria-hidden="true">□</i><button class="window-close" type="button" aria-label="Close window">×</button></span>
              </div>
              <div class="window-body" data-panel="welcome">
                <span class="window-art" aria-hidden="true">:)</span>
                <div><h2>KOYAK'S TOWER</h2><p>Click an icon to look around.</p></div>
              </div>
            </div>

            <div class="retro-taskbar" aria-label="Open windows">
              <span class="start-button"><b>◆</b> START</span>
              <span class="task-divider"></span>
              <div class="task-list"></div>
              <time class="task-clock" datetime="">--:--</time>
            </div>
          </div>
        </section>
      </main>

      <aside class="side-rail side-rail--right" aria-hidden="true">
        <div class="rail-clip">
          <div class="rail-track">
            <div class="rail-loop"><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span></div>
            <div class="rail-loop"><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span><span>KOYAK</span></div>
          </div>
        </div>
      </aside>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
